<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100dvh;
  background:#0a0012;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  position:relative;
}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg::before{content:"";position:absolute;width:60vmin;height:60vmin;top:-20%;left:-10%;background:radial-gradient(circle,rgba(0,255,255,.12) 0%,transparent 70%);animation:drift1 16s ease-in-out infinite}
.bg::after{content:"";position:absolute;width:60vmin;height:60vmin;bottom:-20%;right:-10%;background:radial-gradient(circle,rgba(255,0,255,.1) 0%,transparent 70%);animation:drift2 20s ease-in-out infinite}

.gelatine {
  transform: scale(1, 1);
  object-fit: contain;
  width: 100%;
  height: 100%;
  scale: 1.1;
  display: block;
}

.gelatine.is-animating {
  animation: gelatine 0.5s ease-in-out;
}

@keyframes gelatine {
  from, to { transform: scale(1, 1); }
  25% { transform: scale(0.9, 1.1); }
  50% { transform: scale(1.1, 0.9); }
  75% { transform: scale(0.95, 1.05); }
}



@keyframes drift1{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30vw,20vh) scale(1.15)}
  66%{transform:translate(-10vw,40vh) scale(.9)}
}
@keyframes drift2{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-25vw,-15vh) scale(1.1)}
  66%{transform:translate(15vw,-30vh) scale(.85)}
}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.particle{position:absolute;border-radius:50%;opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.7}
  90%{opacity:.9}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}

.heartbeat{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  pointer-events:none;
  width:min(600px,95vw);height:min(600px,95vw);
}
.ring{
  position:absolute;
  border-radius:50%;
  inset:0;margin:auto;
  opacity: 0;
  width:min(480px,90vw);height:min(480px,90vw);
  animation:hb-ring 13s cubic-bezier(.25,.46,.45,.94) infinite;
}
.ring::before{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2.5px solid rgba(0,255,255,.28);
  box-shadow:0 0 30px rgba(0,255,255,.15),0 0 80px rgba(0,255,255,.06);
}
.ring:nth-child(2){
  opacity: 0;
  width:min(600px,95vw);height:min(600px,95vw);
  animation-delay:.5s;
}
.ring:nth-child(2)::before{
  border-color:rgba(255,0,255,.22);
  box-shadow:0 0 30px rgba(255,0,255,.1),0 0 80px rgba(255,0,255,.04);
}

@keyframes hb-ring{
  0%{transform:scale(.88);opacity:0}
  15%{transform:scale(1.04);opacity:.6}
  36%{transform:scale(.93);opacity:.3}
  45%{transform:scale(1.1);opacity:.75}
  60%{transform:scale(.97);opacity:.4}
  85%,100%{transform:scale(1);opacity:0}
}

.card{
  position:absolute;z-index:10;
  width:min(420px,90vw);
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  padding:2.5rem 2rem 2rem;
  text-align:center;
  color:#fff;
  box-shadow:
    0 8px 32px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);
  animation:cardIn .8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.96)}
}

.avatar{
  width:96px;height:96px;
  margin:0 auto 1rem;
  border-radius:50%;
  background:linear-gradient(135deg,#0ff,#f0f);
  padding:3px;
  animation:pulse-glow 4s ease-in-out infinite;
}
.avatar-inner{
  width:100%;height:100%;
  border-radius:50%;
  background:#0a0012;
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;
  overflow:hidden;
}

@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 20px rgba(0,255,255,.25),0 0 60px rgba(255,0,255,.1)}
  50%{box-shadow:0 0 30px rgba(0,255,255,.4),0 0 80px rgba(255,0,255,.2)}
}

h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.25rem}
.bio{font-size:.85rem;color:rgba(255,255,255,.5);margin-bottom:1.8rem;line-height:1.5}

.links{display:flex;flex-direction:column;gap:.75rem}
.link{
  display:flex;align-items:center;gap:.85rem;
  padding:.9rem 1.2rem;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  text-decoration:none;color:#fff;font-weight:500;font-size:.92rem;
  transition:all .3s cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;
}
.link::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,255,255,.08),rgba(255,0,255,.06));
  opacity:0;transition:opacity .3s;
}
.link:hover{
  border-color:rgba(0,255,255,.3);
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,255,255,.12),0 2px 8px rgba(255,0,255,.08);
}
.link:hover::before{opacity:1}

.link-icon{
  position:relative;z-index:1;
  width:36px;height:36px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:rgba(255,255,255,.06);
  transition:background .3s;
}
.link:hover .link-icon{background:rgba(255,255,255,.1)}

.link-text{position:relative;z-index:1;text-align:left;flex:1}
.link-label{font-size:.7rem;color:rgba(255,255,255,.4);display:block;margin-top:1px;font-weight:400}

.link-icon svg{width:18px;height:18px;fill:#fff;opacity:.85}
.link:hover .link-icon svg{opacity:1}

.footer{margin-top:1.6rem;font-size:.7rem;color:rgba(255,255,255,.2)}

<script>
document.querySelectorAll('.gelatine').forEach(el => {
  el.addEventListener('mouseenter', () => {
    el.classList.remove('is-animating');
    void el.offsetWidth;
    el.classList.add('is-animating');
  });

  el.addEventListener('animationend', () => {
    el.classList.remove('is-animating');
  });
});
</script>
<script>
// Generate floating particles
const c=document.getElementById('particles');
for(let i=0;i<25;i++){
  const p=document.createElement('div');
  p.className='particle';
  const s=Math.random()*12+1;
  const colors=['rgba(0,255,255,.5)','rgba(255,0,255,.4)','rgba(128,0,255,.4)'];
  p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[i%3]};animation-duration:${Math.random()*12+10}s;animation-delay:${Math.random()*15}s`;
  c.appendChild(p);
}
</script>
